name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: smoke (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install .

      - name: Smoke test the CLI
        run: python -m lscom --version

      - name: Smoke test the console script
        shell: bash
        run: |
          set -euo pipefail
          expected="$(python -c 'from lscom.__version__ import __version__; print(__version__)')"
          version="$(lscom --version)"
          printf '%s\n' "$version"
          case "$version" in
            *"$expected"*) ;;
            *) echo "unexpected version: $version (expected $expected)" >&2; exit 1 ;;
          esac
          lscom --help >/dev/null
          lscom

  build:
    name: build sdist and wheel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build
          test -n "$(find dist -name '*.whl' -print -quit)"
          test -n "$(find dist -name '*.tar.gz' -print -quit)"

      - name: Install the wheel and smoke test
        run: |
          python -m pip install dist/*.whl
          lscom --version
          lscom --help
          lscom
